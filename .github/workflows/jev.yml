name: jev-paper

on:
  schedule:
    - cron: "*/15 * * * *"    # scan co 15 min (repo publiczne = darmowe minuty)
    - cron: "0 18 * * 0"     # report w niedziele (UTC)
  workflow_dispatch:
    inputs:
      command:
        description: "scan, check, report albo testmail"
        default: "scan"

permissions:
  contents: write
  issues: write

concurrency:
  group: jev-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wybierz komende
        id: cmd
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_CMD: ${{ github.event.inputs.command }}
        run: |
          NAME="scan"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$INPUT_CMD" in
              scan|check|report|testmail) NAME="$INPUT_CMD" ;;
            esac
          elif [ "$SCHEDULE" = "0 18 * * 0" ]; then
            NAME="report"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Uruchom
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          CMD: ${{ steps.cmd.outputs.name }}
        run: |
          if [ "$CMD" = "report" ]; then
            python jev_paper.py report | tee report.txt
          else
            python jev_paper.py "$CMD"
          fi

      - name: Zapisz wyniki w repozytorium
        run: |
          git config user.name "jev-bot"
          git config user.email "jev-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Brak zmian"
          else
            git commit -m "jev-paper: ${{ steps.cmd.outputs.name }}"
            git pull --rebase -q || true
            git push
          fi

      - name: Powiadom mailem (Issue z oznaczeniem wlasciciela)
        if: ${{ hashFiles('notify.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="$(head -n1 notify.md | sed 's/^# //')"
          gh issue create --title "$TITLE" --body-file notify.md

      - name: Raport tygodniowy mailem (Issue)
        if: ${{ steps.cmd.outputs.name == 'report' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "@${{ github.repository_owner }} Raport tygodniowy (test papierowy, nie rekomendacja):"; echo; echo '```'; cat report.txt; echo '```'; } > report.md
          gh issue create --title "Raport tygodniowy jev-paper" --body-file report.md
